name: Test Watch Studio web app
on:
  push:
    paths: ['docs/**', 'tests/**', 'package*.json', '.github/workflows/web.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check docs/app.js
      - run: npm test
